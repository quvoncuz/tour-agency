# ===== SERVER =====
server.port=8081
server.servlet.context-path=/api/v1

# ===== H2 IN-MEMORY DB =====
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

spring.main.allow-bean-definition-overriding=true

spring.security.jwt.access-key=TourAgencyVeryveryLongAccessSecretkeyForJwtTokenGeneRationAndValidatiOnYouCanchangeItButYouCanFindThissecretKey

spring.cloud.openfeign.circuitbreaker.enabled=false
eureka.client.enabled=false
spring.cloud.config.enabled=false

management.tracing.enabled=false
management.zipkin.tracing.endpoint=

resilience4j.circuitbreaker.instances.asistent-service.sliding-window-size=10
resilience4j.timelimiter.instances.asistent-service.timeout-duration=99s

click.base-url=http://localhost
click.service-id=0
click.merchant-id=0
click.secret-key=test
